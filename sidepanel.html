<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>locally</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="deck">
        <div class="title-row">
          <div>
            <p class="eyebrow">Google Maps</p>
            <h1>locally</h1>
          </div>
          <div class="title-actions">
            <span id="collectPill" class="pill" hidden>Collecting</span>
            <button id="mapsBtn" class="icon-btn" type="button" aria-label="Open Google Maps" title="Open Google Maps">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3z" /><path d="M9 3v15M15 6v15" /></svg>
            </button>
          </div>
        </div>

        <p id="statusLine" class="status" role="status">Opening Google Maps…</p>
        <p id="queryLine" class="query" hidden></p>

        <div class="kpis" aria-label="Lead totals">
          <div class="kpi">
            <strong id="kpiBusinesses">0</strong>
            <span>Businesses</span>
          </div>
          <div class="kpi">
            <strong id="kpiEmails">0</strong>
            <span>Emails</span>
          </div>
          <div class="kpi">
            <strong id="kpiMissing">0</strong>
            <span>Missing</span>
          </div>
        </div>

        <div id="idleActions">
          <div class="actions">
            <button id="collectBtn" class="btn primary grow" type="button" data-mode="start">
              <svg class="icon ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              <svg class="icon ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
              <span class="btn-label">Start collecting</span>
            </button>
          </div>
          <button id="findBtn" class="btn primary find" type="button" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg>
            <span class="btn-label">Find emails</span>
          </button>
        </div>

        <div id="runActions" class="actions" hidden>
          <button id="pauseBtn" class="btn ghost grow" type="button" data-mode="pause">
            <svg class="icon ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z" /></svg>
            <svg class="icon ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <span class="btn-label">Pause</span>
          </button>
          <button id="stopBtn" class="btn danger grow" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
            <span class="btn-label">Stop</span>
          </button>
        </div>

        <div id="progressWrap" class="progress-block" hidden>
          <div class="progress-head">
            <span id="progressName">Checking</span>
            <span id="progressCount"></span>
          </div>
          <div id="progressHost" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Email lookup progress">
            <span id="progressBar"></span>
          </div>
        </div>

        <label class="search">
          <span class="sr">Filter leads</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="filterInput" type="search" placeholder="Filter name, phone, email" />
        </label>

        <div class="segments" role="group" aria-label="Filter by email">
          <button type="button" data-segment="all" aria-pressed="true">All</button>
          <button type="button" data-segment="email" aria-pressed="false">Emails</button>
          <button type="button" data-segment="missing" aria-pressed="false">Missing</button>
        </div>
      </header>

      <main id="list" class="list"></main>

      <footer class="bar">
        <button id="exportBtn" class="btn ghost grow" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M5 21h14" /></svg>
          <span class="btn-label">Export CSV</span>
        </button>
        <button id="clearBtn" class="btn ghost" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16" /><path d="M9 7V5h6v2" /><path d="M7 7l1 13h8l1-13" /></svg>
          <span class="btn-label">Clear</span>
        </button>
      </footer>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
